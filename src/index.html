<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GTD Timer</title>
    <style>
        .drag-header {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 24px;
            z-index: 100;
            background: transparent;
            pointer-events: auto;
            user-select: none;
            cursor: grab;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            background: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100vw;
            height: 100vh;
            padding: 0;
            margin: 0;
            overflow: hidden;
        }

        .timer-container {
            background: rgba(255, 255, 255, 0.6);
            border-radius: 20px;
            padding: 0.5%;
            box-shadow: none;
            text-align: center;
            position: relative;
            width: 98%;
            height: 98%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .timer-circle {
            width: min(65vw, 65vh);
            height: min(65vw, 65vh);
            margin: 0 0 1vh;
            position: relative;
            border-radius: 50%;
            background: rgba(248, 248, 248, 0.4);
            overflow: hidden;
            cursor: pointer;
            z-index: 1;
            -webkit-app-region: no-drag;
        }

        .timer-fill {
            position: absolute;
            width: 100%;
            height: 100%;
            background: rgba(255, 68, 68, 0.8);
            transform-origin: center;
            transition: background 0.1s ease-out;
            cursor: pointer;
            pointer-events: auto;
        }

        .digital-timer {
            background: rgba(255, 255, 255, 0.6);
            font-size: min(8vw, 8vh);
            font-weight: 300;
            color: #333;
            margin-bottom: 0;
            font-family: 'SF Mono', 'Monaco', 'Courier New', monospace;
            letter-spacing: 1px;
            cursor: pointer;
            position: relative;
            z-index: 2;
            padding: 0px 10px;
            border-radius: 12px;
            -webkit-app-region: no-drag;
        }

        .duration-input-overlay {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 255, 255, 0.95);
            border-radius: 16px;
            padding: 16px 20px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.15);
            z-index: 10;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            -webkit-app-region: no-drag;
        }

        .duration-input-overlay.visible {
            display: flex;
        }

        .duration-input-overlay label {
            font-size: 12px;
            color: #888;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            white-space: nowrap;
        }

        .duration-input-overlay input {
            width: 80px;
            font-size: min(8vw, 8vh);
            font-weight: 300;
            font-family: 'SF Mono', 'Monaco', 'Courier New', monospace;
            text-align: center;
            border: none;
            border-bottom: 2px solid rgba(255, 68, 68, 0.6);
            background: transparent;
            outline: none;
            color: #333;
            padding: 2px 4px;
        }

        .duration-hint {
            font-size: 11px;
            color: #aaa;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        .cycle-counter {
            position: absolute;
            top: 12px;
            right: 12px;
            font-size: 11px;
            color: rgba(0, 0, 0, 0.4);
            font-weight: 500;
            padding: 4px 8px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.5);
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: 3;
            -webkit-app-region: no-drag;
        }

        .cycle-counter.visible {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div class="drag-header"></div>
    <div class="timer-container">
        <div class="timer-circle" id="timerCircle">
            <div class="timer-fill" id="timerFill"></div>
        </div>

        <div class="digital-timer" id="digitalTimer">2:00</div>
        <div class="cycle-counter" id="cycleCounter">0 cycles</div>
        <div class="duration-input-overlay" id="durationOverlay">
            <label>Minutes (Enter to confirm)</label>
            <input type="number" id="durationInput" min="1" max="999" value="2" />
            <span class="duration-hint">ESC to cancel</span>
        </div>
    </div>

    <script>
        let totalTime = 120; // default 2 minutes in seconds
        let remainingTime = totalTime * 1000;
        let timerInterval = null;
        let isRunning = false;
        let completedCycles = 0;
        let startTime = null;
        let pausedTime = totalTime * 1000;
        let timerGeneration = 0; // Used to invalidate old intervals

        const timerFill = document.getElementById('timerFill');
        const digitalTimer = document.getElementById('digitalTimer');
        const cycleCounter = document.getElementById('cycleCounter');
        const durationOverlay = document.getElementById('durationOverlay');
        const durationInput = document.getElementById('durationInput');

        function updateDisplay() {
            // Calculate current time
            const timeInSeconds = Math.ceil(remainingTime / 1000);

            // Update digital timer (shows seconds)
            const minutes = Math.floor(timeInSeconds / 60);
            const seconds = timeInSeconds % 60;
            digitalTimer.textContent = `${minutes}:${seconds.toString().padStart(2, '0')}`;

            // Update circular timer (smooth animation)
            const progress = (totalTime * 1000 - remainingTime) / (totalTime * 1000);

            if (remainingTime >= totalTime * 1000) {
                timerFill.style.background = 'rgba(255, 68, 68, 0.8)';
            } else if (remainingTime <= 0) {
                timerFill.style.background = 'transparent';
            } else {
                const progressDegrees = progress * 360;
                timerFill.style.background = `conic-gradient(from 0deg, transparent 0deg, transparent ${progressDegrees}deg, rgba(255, 68, 68, 0.8) ${progressDegrees}deg, rgba(255, 68, 68, 0.8) 360deg)`;
            }
        }

        function updateCycleCounter() {
            cycleCounter.textContent = `${completedCycles} cycles`;
            if (completedCycles > 0) {
                cycleCounter.classList.add('visible');
            } else {
                cycleCounter.classList.remove('visible');
            }
        }

        function toggleTimer() {
            if (isRunning) {
                stopTimer();
            } else {
                startTimer();
            }
        }

        function startTimer() {
            if (!isRunning) {
                isRunning = true;
                pausedTime = remainingTime; // Capture current remaining time
                startTime = Date.now();
                timerGeneration++; // Increment generation
                const currentGeneration = timerGeneration;
                
                timerInterval = setInterval(() => {
                    // Ignore if this interval is outdated
                    if (currentGeneration !== timerGeneration) {
                        return;
                    }
                    
                    const elapsed = Date.now() - startTime;
                    remainingTime = pausedTime - elapsed;
                    
                    if (remainingTime <= 0) {
                        remainingTime = 0;
                        updateDisplay();
                        completeTimer();
                    } else {
                        updateDisplay();
                    }
                }, 50); // Update every 50ms for smooth animation
            }
        }

        function stopTimer() {
            if (isRunning) {
                isRunning = false;
                timerGeneration++; // Invalidate old interval
                clearInterval(timerInterval);
                timerInterval = null;
                pausedTime = remainingTime; // Save current time for resume
            }
        }

        function resetTimer() {
            // Invalidate any running interval
            timerGeneration++;
            clearInterval(timerInterval);
            timerInterval = null;
            const wasRunning = isRunning;
            isRunning = false;

            // Reset all timing values
            remainingTime = totalTime * 1000;
            pausedTime = totalTime * 1000;
            completedCycles = 0;
            startTime = null;
            updateDisplay();
            updateCycleCounter();

            // Restart if it was running
            if (wasRunning) {
                startTimer();
            }
        }

        function completeTimer() {
            completedCycles++;
            updateCycleCounter();

            // Auto-restart for next 2-minute session
            if (isRunning) {
                isRunning = false;
                clearInterval(timerInterval);
            }
            remainingTime = totalTime * 1000;
            pausedTime = totalTime * 1000;
            updateDisplay();
            startTimer();
        }

        function toggleControlsSection() {
            const controlsSection = document.getElementById('controlsSection');
            const toggleBtn = document.getElementById('toggleControls');
            
            if (controlsSection.classList.contains('expanded')) {
                controlsSection.classList.remove('expanded');
                controlsSection.classList.add('collapsed');
                toggleBtn.classList.remove('expanded');
                toggleBtn.classList.add('collapsed');
            } else {
                controlsSection.classList.remove('collapsed');
                controlsSection.classList.add('expanded');
                toggleBtn.classList.remove('collapsed');
                toggleBtn.classList.add('expanded');
            }
        }

        // Initialize display
        updateDisplay();
        updateCycleCounter();

        // Click handlers
        timerFill.addEventListener('click', (e) => {
            e.stopPropagation();
            toggleTimer();
        });

        // Duration setting: double-click on digital timer to open input
        let lastClickTime = 0;
        let singleClickTimeout = null;
        digitalTimer.addEventListener('mousedown', (e) => {
            e.stopPropagation();
            e.preventDefault();
            const now = Date.now();
            if (now - lastClickTime < 350) {
                // Double click — cancel pending single click, open duration input
                clearTimeout(singleClickTimeout);
                singleClickTimeout = null;
                lastClickTime = 0;
                openDurationInput();
            } else {
                // Might be single click — wait to see if double follows
                lastClickTime = now;
                singleClickTimeout = setTimeout(() => {
                    singleClickTimeout = null;
                    resetTimer();
                }, 350);
            }
        });

        function openDurationInput() {
            const wasRunning = isRunning;
            if (wasRunning) stopTimer();
            durationInput.value = Math.round(totalTime / 60);
            durationOverlay.classList.add('visible');
            durationInput.focus();
            durationInput.select();

            function confirmDuration() {
                const mins = parseInt(durationInput.value, 10);
                if (!isNaN(mins) && mins >= 1) {
                    setDuration(mins);
                }
                closeDurationInput();
            }

            function closeDurationInput() {
                durationOverlay.classList.remove('visible');
                durationInput.removeEventListener('keydown', onKey);
                durationOverlay.removeEventListener('click', onOverlayClick);
            }

            function onKey(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    confirmDuration();
                } else if (e.key === 'Escape') {
                    closeDurationInput();
                }
            }

            function onOverlayClick(e) {
                // clicking outside the input confirms
                if (e.target === durationOverlay) confirmDuration();
            }

            durationInput.addEventListener('keydown', onKey);
            durationOverlay.addEventListener('click', onOverlayClick);
        }

        function setDuration(minutes) {
            totalTime = minutes * 60;
            remainingTime = totalTime * 1000;
            pausedTime = totalTime * 1000;
            completedCycles = 0;
            timerGeneration++;
            clearInterval(timerInterval);
            timerInterval = null;
            isRunning = false;
            startTime = null;
            updateDisplay();
            updateCycleCounter();
        }

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                toggleTimer();
            } else if (e.code === 'KeyR') {
                e.preventDefault();
                resetTimer();
            }
        });

        // Handle window resize
        window.addEventListener('resize', () => {
            updateDisplay();
        });

        // Handle window dragging via Tauri API
        const dragHeader = document.querySelector('.drag-header');
        dragHeader.addEventListener('mousedown', async (e) => {
            if (e.button === 0) { // Left mouse button only
                await window.__TAURI__.window.getCurrentWindow().startDragging();
            }
        });

    </script>
</body>
</html>
